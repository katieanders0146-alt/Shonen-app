plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.marverick.shonen'
    compileSdk 34

    defaultConfig {
        applicationId "com.marverick.shonen"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Kept minimal on purpose so this first build has nothing to fail on.
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // NEXT STEP (don't add yet) — once this builds and installs cleanly,
    // uncomment these for the camera + pose detection milestone:
    // implementation 'androidx.camera:camera-core:1.3.4'
    // implementation 'androidx.camera:camera-camera2:1.3.4'
    // implementation 'androidx.camera:camera-lifecycle:1.3.4'
    // implementation 'androidx.camera:camera-view:1.3.4'
    // implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
}
